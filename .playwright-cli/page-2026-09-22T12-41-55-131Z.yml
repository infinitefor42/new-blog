          - heading "Linux 发展简史" [level=2] [ref=e97]
          - heading "Unix 的诞生（1969）" [level=3] [ref=e98]
          - paragraph [ref=e99]: 1969 年，Ken Thompson 和 Dennis Ritchie 在贝尔实验室用汇编语言写出了 Unix 的原型。1973 年，Dennis Ritchie 用 C 语言重写了 Unix，使其具备了可移植性，Unix 开始在学术界和企业广泛传播。
          - heading "GNU 计划与自由软件运动（1983）" [level=3] [ref=e100]
          - paragraph [ref=e101]:
            - text: 1983 年，Richard Stallman 发起 GNU 计划（GNU's Not Unix），目标是创建一个完全自由的类 Unix 操作系统。GNU 开发了 GCC（编译器）、Emacs（编辑器）、Bash（Shell）等核心工具，但缺少一个关键部分——
            - strong [ref=e102]: 内核
            - text: 。
          - heading "Linux 内核诞生（1991）" [level=3] [ref=e103]
          - paragraph [ref=e104]: 1991 年，芬兰大学生 Linus Torvalds 出于学习目的，开发了一个 Unix-like 内核，最初在 Minix 新闻组发布：
          - blockquote [ref=e105]:
            - paragraph [ref=e106]: "\"I'm doing a (free) operating system (just a hobby, won't be big and professional like gnu) for 386(486) AT clones.\""
          - paragraph [ref=e107]: 同年 9 月 17 日，Linux 0.01 版公开发布，约 1 万行代码。Linus 采用 GPL 许可证，使其与 GNU 工具链结合，形成了完整的操作系统。
          - heading "命名由来" [level=3] [ref=e108]
          - paragraph [ref=e109]:
            - text: Linus 最初想将内核命名为 Freax（Free + Unix），但他的同事 Ari Lemmke 在给 FTP 服务器创建目录时，觉得 Freax 不好听，直接用了 Linus 的名字 + Unix，取名为
            - strong [ref=e110]: Linux
            - text: 。
